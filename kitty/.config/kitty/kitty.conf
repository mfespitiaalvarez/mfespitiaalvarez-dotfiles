# ==========================
# Font
# ==========================
# JetBrainsMono Nerd Font (installed under ~/.local/share/fonts/JetBrainsMono).
# Use the "Mono" variant so Nerd Font icons render at single-cell width and
# columns stay aligned (matters for the tmux/catppuccin status bar).
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# kitty has built-in Nerd Font symbol coverage, but since the main font is
# already a Nerd Font, every glyph (powerline, icons) comes straight from it —
# no symbol_map needed.

# ==========================
# Colors — Ubuntu GNOME Terminal look
# ==========================
# The classic Ubuntu terminal: aubergine background, white text, Tango palette,
# block cursor. (Font stays JetBrainsMono Nerd Font above so tmux glyphs work.)
background            #300A24
foreground            #FFFFFF

# Block cursor; the glyph under it shows in the background color so it stays legible.
cursor                #FFFFFF
cursor_text_color     #300A24
cursor_shape          block

selection_background  #B5D5FF
selection_foreground  #300A24

# Tango 16-color palette (GNOME Terminal / Ubuntu default). Pairs are normal/bright.
color0  #2E3436
color8  #555753
color1  #CC0000
color9  #EF2929
color2  #4E9A06
color10 #8AE234
color3  #C4A000
color11 #FCE94F
color4  #3465A4
color12 #729FCF
color5  #75507B
color13 #AD7FA8
color6  #06989A
color14 #34E2E2
color7  #D3D7CF
color15 #EEEEEC

# ==========================
# Window
# ==========================
# Borderless: hide the OS title bar + min/max/close buttons so it's just the
# terminal. Note: with no titlebar there's no click target to drag/close the
# window — move via your WM shortcut (often Super+drag) and close by exiting
# the shell. Reverse by setting this to "no".
hide_window_decorations yes
