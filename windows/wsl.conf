# Goes to /etc/wsl.conf INSIDE the distro (sudo required), not on the Windows
# side. Run `wsl.exe --shutdown` from Windows afterwards to apply.

[boot]
# systemd, so services (docker, snap-installed things) behave like a normal
# Ubuntu box rather than needing manual starts.
systemd=true

[user]
# Which user `wsl.exe` drops into, and therefore which home the wezterm
# bootstrap's `~` resolves to. Change to your username on a fresh install.
default=mfea

[automount]
# metadata: store Linux uid/gid/mode as NTFS extended attributes on /mnt/c.
# Without it every Windows file reads as 0777 root-owned, chmod silently does
# nothing, and symlinks made under /mnt/c don't survive. Required for the
# ~/win -> /mnt/c/Users/<you> setup to behave.
options = "metadata"
