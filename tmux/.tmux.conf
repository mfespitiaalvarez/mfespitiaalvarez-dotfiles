# ==========================
# General Settings
# ==========================
# Change prefix from Ctrl+B to Ctrl+A
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Mouse on
set -g mouse on

# Fix colors for Neovim (Crucial for CloudTop/SSH)
set -g default-terminal "screen-256color"
# Flag the *outer* terminal as truecolor-capable, matched on the TERM tmux was
# launched under. Without RGB, tmux quantizes to 256 colors and the onedark
# background drifts off #282c34.
# tmux >= 3.5 already has xterm-ghostty in its built-in features table (check
# with `tmux display -p '#{client_termfeatures}'`), so the ghostty line is a
# no-op here — it's kept for older tmux on other machines.
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ==========================
# Navigation & Splits
# ==========================
# 'o' for horizontal, 'e' for vertical
unbind '"'
unbind %
bind o split-window -v -c "#{pane_current_path}"
bind e split-window -h -c "#{pane_current_path}"

# Seamless Vim/Tmux Navigation
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Resize panes using Alt-direction (No prefix)
bind -n M-h resize-pane -L 5
bind -n M-j resize-pane -D 5
bind -n M-k resize-pane -U 5
bind -n M-l resize-pane -R 5

# ==========================
# Copy Mode
# ==========================
# System clipboard is handled by the terminal: Ctrl+Shift+C / Ctrl+Shift+V.
# Hold Shift while selecting with the mouse to bypass tmux and select natively.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ==========================
# System Bindings
# ==========================
# Reload config
bind r source-file ~/.tmux.conf \; display "Tmux Config Reloaded!"
# Kill window without confirmation
bind-key & kill-window

# Set options top
set-option -g status-position top

# ====================
# Plugins
# ====================
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'

# Rounded window/tab separators. catppuccin v2.x builds the tab format from this
# when tpm sources the plugin (the `run` line below), so it must be set first.
# With "rounded", the plugin supplies its own left/middle/right separators.
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "directory session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_directory_text "#{pane_current_path}"

# ====================
# Catppuccin palette override — "Atom One Dark" (matches ghostty + onedark.nvim)
# ====================
# The flavor theme sets every @thm_* with `set -ogq` (only-if-unset), so
# defining them here — before tpm sources the plugin below — wins without
# editing the plugin. @thm_mantle is the exact ghostty background (#282c34) so
# the status bar blends into the terminal, and the accents are Atom One Dark's
# syntax colors so tmux, nvim and the terminal all agree.
# (@thm_mauve drives the active window pill; @thm_green the session module.)

# Backgrounds / surfaces (dark -> light)
set -g @thm_crust      "#1b1f23"
set -g @thm_mantle     "#282c34"
set -g @thm_bg         "#2c313a"
set -g @thm_surface_0  "#323842"
set -g @thm_surface_1  "#3e4451"
set -g @thm_surface_2  "#4b5263"
set -g @thm_overlay_0  "#5c6370"
set -g @thm_overlay_1  "#687081"
set -g @thm_overlay_2  "#767d8c"

# Text
set -g @thm_fg         "#abb2bf"
set -g @thm_subtext_1  "#9da5b4"
set -g @thm_subtext_0  "#828997"

# Accents — Atom One Dark syntax palette
set -g @thm_mauve      "#c678dd"
set -g @thm_red        "#e06c75"
set -g @thm_maroon     "#be5046"
set -g @thm_peach      "#d19a66"
set -g @thm_yellow     "#e5c07b"
set -g @thm_green      "#98c379"
set -g @thm_teal       "#56b6c2"
set -g @thm_sky        "#6cc4d0"
set -g @thm_sapphire   "#519fd8"
set -g @thm_blue       "#61afef"
set -g @thm_lavender   "#a9a1e1"
set -g @thm_rosewater  "#dcb8a8"
set -g @thm_flamingo   "#d8a99a"
set -g @thm_pink       "#d291bc"

run '~/.tmux/plugins/tpm/tpm'
